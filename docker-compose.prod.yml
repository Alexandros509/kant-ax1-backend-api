# 서버(EC2) 배포용. 로컬 개발은 docker-compose.yml을 씁니다.
# 같은 폴더의 .env에 POSTGRES_PASSWORD, DATABASE_URL(@db:5432), SECRET_KEY가 있어야 합니다.
services:
  db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env에 넣으세요}
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    # DB 포트는 외부에 열지 않습니다. 앱만 내부망(db:5432)으로 접속합니다.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: always
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
